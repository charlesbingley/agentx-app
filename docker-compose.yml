name: agentx-app

services:
  postgres:
    image: postgres:16
    container_name: agentx-app-postgres
    environment:
      POSTGRES_DB: agentx-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - agentx-app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: agentx-app-redis
    ports:
      - "6379:6379"
    volumes:
      - agentx-app_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  agentx-app_postgres_data:
  agentx-app_redis_data:
